<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="02 React 학습 TODO 리스트" />
    <title>02 React | TODO List</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <div>
          <p class="eyebrow">02_REACT / WORKSPACE</p>
          <h1>오늘의 작업을<br /><em>선명하게</em> 정리하세요.</h1>
          <p class="hero-copy">작은 체크 하나가 다음 화면을 만듭니다.</p>
        </div>
        <div class="progress-ring" aria-label="전체 진행률"><span id="progress-value">0<small>%</small></span></div>
      </header>

      <section class="summary" aria-label="할 일 진행 상황">
        <div><strong id="completed-count">0</strong><span>완료</span></div>
        <div><strong id="remaining-count">0</strong><span>진행 중</span></div>
        <div class="progress-track"><span id="progress-bar"></span></div>
      </section>

      <section class="workspace">
        <div class="toolbar">
          <nav class="filter-tabs" aria-label="할 일 필터">
            <button class="active" data-filter="all">전체</button>
            <button data-filter="active">진행 중</button>
            <button data-filter="done">완료</button>
          </nav>
          <label class="search-box"><span>⌕</span><input id="search-input" type="search" placeholder="할 일 검색" /></label>
        </div>
        <div id="task-groups" class="task-groups"></div>
        <p id="empty-state" class="empty-state" hidden>조건에 맞는 할 일이 없습니다.</p>
        <form id="add-form" class="add-form">
          <span class="plus">+</span>
          <input id="new-task" type="text" placeholder="새 할 일을 입력하세요" aria-label="새 할 일" />
          <button type="submit">추가하기</button>
        </form>
      </section>
      <footer>DESIGNED FOR FOCUS <span>•</span> 02 REACT STUDY</footer>
    </main>
  </body>
</html>
